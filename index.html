<style>
  :root { --ui-bg:#f4f5f7; --ui-fg:#14171c; --ui-muted:#667085; --ui-line:#d8dce3; --ui-card:#fff; --ui-accent:#1f5eff;
          --paper:#ffffff; --grid:#eef1f5; --grid-major:#d9dfe8; --ink:#1a1d22; --dim:#1f5eff; --sel:#ff6a00; }
  @media (prefers-color-scheme: dark) { :root { --ui-bg:#17191d; --ui-fg:#ececec; --ui-muted:#9aa1ad; --ui-line:#33373f; --ui-card:#22252b; --ui-accent:#6ea0ff;
          --paper:#1f2228; --grid:#262a31; --grid-major:#353b45; --ink:#f0f0f0; --dim:#6ea0ff; --sel:#ff9a4d; } }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--ui-bg); color:var(--ui-fg); font:13px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif; display:flex; flex-direction:column; overflow:hidden; }
  button, select, input { font:inherit; color:var(--ui-fg); }
  button, select { background:var(--ui-card); border:1px solid var(--ui-line); border-radius:7px; padding:5px 9px; cursor:pointer; }
  button:hover { border-color:var(--ui-accent); }
  button[aria-pressed=true], button.on { background:var(--ui-accent); border-color:var(--ui-accent); color:#fff; }
  button:disabled { opacity:.4; cursor:default; }
  :focus-visible { outline:2px solid var(--ui-accent); outline-offset:1px; }
  input[type=text], input:not([type]) { background:var(--ui-card); border:1px solid var(--ui-line); border-radius:6px; padding:5px 7px; width:100%; }
  header { display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:6px 10px; background:var(--ui-card); border-bottom:1px solid var(--ui-line); }
  header h1 { font-size:14px; margin:0 6px 0 0; }
  .grp { display:flex; gap:4px; align-items:center; }
  .sep { width:1px; height:22px; background:var(--ui-line); margin:0 3px; }
  #floors { display:flex; gap:4px; padding:6px 10px; background:var(--ui-bg); border-bottom:1px solid var(--ui-line); flex-wrap:wrap; }
  #main { flex:1; min-height:0; display:flex; }
  aside { background:var(--ui-card); overflow:auto; padding:10px; }
  #left { width:216px; border-right:1px solid var(--ui-line); }
  #props { width:250px; border-left:1px solid var(--ui-line); }
  aside h3 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ui-muted); margin:12px 0 6px; font-weight:600; }
  aside h3:first-child { margin-top:0; }
  .tools { display:grid; grid-template-columns:1fr 1fr; gap:4px; }
  .lib { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
  .lib button { padding:3px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10px; line-height:1.1; color:var(--ui-muted); }
  .lib button[aria-pressed=true] { color:#fff; }
  .lib canvas { width:56px; height:40px; background:#fff; border-radius:4px; }
  .row { display:flex; flex-direction:column; gap:3px; margin-bottom:9px; color:var(--ui-muted); font-size:12px; }
  .row.inline { flex-direction:row; align-items:center; justify-content:space-between; }
  .row input[type=checkbox] { width:auto; }
  .row input[type=color] { width:100%; height:30px; padding:2px; border:1px solid var(--ui-line); border-radius:6px; background:var(--ui-card); }
  .sw { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:9px; }
  .sw i { width:22px; height:22px; border-radius:5px; border:1px solid var(--ui-line); cursor:pointer; }
  .btns { display:flex; gap:4px; flex-wrap:wrap; }
  .ro { color:var(--ui-fg); font-weight:600; }
  .note { color:var(--ui-muted); font-size:12px; line-height:1.4; }
  #stage { position:relative; flex:1; min-width:0; }
  canvas#c { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; background:var(--paper); }
  #textbox { position:absolute; display:none; font-weight:600; padding:4px 8px; border:2px solid var(--sel); border-radius:6px; min-width:140px; width:auto; }
  footer { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:5px 10px; background:var(--ui-card); border-top:1px solid var(--ui-line); color:var(--ui-muted); font-size:12px; }
  canvas#c3d { position:absolute; inset:0; width:100%; height:100%; display:none; cursor:grab; background:#cfe3f2; touch-action:none; }
  .ov { position:absolute; display:flex; gap:6px; z-index:5; }
  .ov button { box-shadow:0 1px 4px rgba(0,0,0,.25); }
  #ov3 { top:10px; left:10px; display:none; flex-wrap:wrap; }
  #zoomov { bottom:12px; right:12px; flex-direction:column; }
  #zoomov button { width:34px; height:34px; padding:0; font-size:18px; }
  #dlgback { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:50; }
  #dlg { background:var(--ui-card); border-radius:12px; width:min(1080px,95vw); height:min(760px,92vh); display:flex; overflow:hidden; }
  #dlg .opts { width:290px; padding:16px; overflow:auto; border-right:1px solid var(--ui-line); flex:none; }
  #dlg .prev { flex:1; padding:16px; background:var(--ui-bg); display:flex; flex-direction:column; gap:10px; min-width:0; min-height:0; }
  #dlg .pvbox { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  #dlg canvas { max-width:100%; max-height:100%; background:#fff; box-shadow:0 3px 16px rgba(0,0,0,.3); }
  #home { position:fixed; inset:0; background:var(--ui-bg); z-index:40; display:none; flex-direction:column; overflow:auto; }
  .hwrap { width:100%; max-width:1120px; margin:0 auto; padding:28px 20px 48px; }
  .hwrap h2 { font-size:26px; margin:0 0 4px; }
  .hnew { display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:var(--ui-card); border:1px solid var(--ui-line); border-radius:12px; padding:14px; margin:18px 0 22px; }
  .hnew input[type=text] { flex:1; min-width:200px; width:auto; }
  .hgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
  .pcard { background:var(--ui-card); border:1px solid var(--ui-line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
  .pcard.cur { border-color:var(--ui-accent); box-shadow:0 0 0 1px var(--ui-accent); }
  .pcard img { width:100%; height:160px; object-fit:contain; background:#fff; display:block; border-bottom:1px solid var(--ui-line); cursor:pointer; }
  .pcard .pb { padding:12px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .pcard .pn { font-size:15px; font-weight:700; overflow-wrap:anywhere; }
  .pcard .pm { color:var(--ui-muted); font-size:12px; }
  .pcard .btns { margin-top:auto; padding-top:6px; }
  .pcard input { font-weight:600; }
  #clear { display:none; }
  #projname { width:190px; font-weight:600; }
  #printarea { display:none; }
  @media print {
    body > *:not(#printarea) { display:none !important; }
    body { overflow:visible; display:block; background:#fff; }
    #printarea { display:block; }
    #printarea img { display:block; width:100%; page-break-after:always; }
    #printarea img:last-child { page-break-after:auto; }
  }
  [hidden] { display:none !important; }
</style>

</div>

  <span id="status"></span>
</footer>
<div id="printarea"></div>
<div id="home"><div class="hwrap">

    <input id="hname" type="text" aria-label="Project name" placeholder="Project name">

  </div>
  <div class="hgrid" id="hgrid"></div>
</div></div>
<div id="dlgback"><div id="dlg" role="dialog" aria-modal="true" aria-label="Print">

  </div>
</div></div>

function drawOpening(c,o,v,P,ink,K){

function dimGeom(d){ const L=Math.hypot(d.x2-d.x1,d.y2-d.y1)||1e-6, ux=(d.x2-d.x1)/L, uy=(d.y2-d.y1)/L, nx=-uy, ny=ux, o=d.off||0; return {L,ux,uy,nx,ny,ax:d.x1+nx*o,ay:d.y1+ny*o,bx:d.x2+nx*o,by:d.y2+ny*o}; }

function autoRoom(p){
  const f=F(); if(!f.walls.length) return null;
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9; for(const w of f.walls){minx=Math.min(minx,w.x1,w.x2);maxx=Math.max(maxx,w.x1,w.x2);miny=Math.min(miny,w.y1,w.y2);maxy=Math.max(maxy,w.y1,w.y2);}
  const cs=.125,m=2,x0=Math.floor((minx-m)/cs)*cs,y0=Math.floor((miny-m)/cs)*cs,nx=Math.ceil((maxx+m-x0)/cs),ny=Math.ceil((maxy+m-y0)/cs);
  if(nx*ny>3e6) return null;
  const st=new Uint8Array(nx*ny); // 1 blocked, 2 filled
  for(const w of f.walls){ const th=(w.th||.5)/2, i1=Math.max(0,Math.floor((Math.min(w.x1,w.x2)-th-x0)/cs)), i2=Math.min(nx-1,Math.ceil((Math.max(w.x1,w.x2)+th-x0)/cs)), j1=Math.max(0,Math.floor((Math.min(w.y1,w.y2)-th-y0)/cs)), j2=Math.min(ny-1,Math.ceil((Math.max(w.y1,w.y2)+th-y0)/cs));
    for(let j=j1;j<=j2;j++)for(let i=i1;i<=i2;i++){ if(segDist(x0+(i+.5)*cs,y0+(j+.5)*cs,w.x1,w.y1,w.x2,w.y2).d<th) st[j*nx+i]=1; } }
  const si=Math.floor((p.x-x0)/cs),sj=Math.floor((p.y-y0)/cs); if(si<0||sj<0||si>=nx||sj>=ny||st[sj*nx+si]===1) return null;
  const stack=[sj*nx+si]; st[sj*nx+si]=2; let open=false, count=0;
  while(stack.length){ const k=stack.pop(), i=k%nx, j=(k-i)/nx; count++; if(i===0||j===0||i===nx-1||j===ny-1) open=true;
    if(i>0&&!st[k-1]){st[k-1]=2;stack.push(k-1);} if(i<nx-1&&!st[k+1]){st[k+1]=2;stack.push(k+1);} if(j>0&&!st[k-nx]){st[k-nx]=2;stack.push(k-nx);} if(j<ny-1&&!st[k+nx]){st[k+nx]=2;stack.push(k+nx);} }

  for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){ if(st[j*nx+i]!==2)continue;
    if(j===0||st[(j-1)*nx+i]!==2) add(j*W1+i,j*W1+i+1);
    if(i===nx-1||st[j*nx+i+1]!==2) add(j*W1+i+1,(j+1)*W1+i+1);
    if(j===ny-1||st[(j+1)*nx+i]!==2) add((j+1)*W1+i+1,(j+1)*W1+i);
    if(i===0||st[j*nx+i-1]!==2) add((j+1)*W1+i,j*W1+i); }
  let best=null,bestA=-1;
  while(edges.size){
    const start=edges.keys().next().value; let cur=start; const loop=[];
    for(let guard=0;guard<1e6;guard++){ const lst=edges.get(cur); if(!lst||!lst.length)break; const nxt=lst.pop(); if(!lst.length)edges.delete(cur); loop.push(cur); cur=nxt; if(cur===start)break; }
    if(loop.length>=4){ const pts=loop.map(k=>{const i=k%W1;return [x0+i*cs,y0+((k-i)/W1)*cs];}), a=polyArea(pts); if(a>bestA){bestA=a;best=pts;} }
  }

  return out.length>=3?out:null;
}

  if(tool==="wall"){const a=snapPoint(p);drag={type:"wall",a,b:a};}
  else if(tool==="room"){drag={type:"room",a:{x:snap(p.x),y:snap(p.y)},b:{x:snap(p.x),y:snap(p.y)},moved:false,sx:q.x,sy:q.y};}
  else if(tool==="door"||tool==="window"){
    const h=hit(p);
    if(h&&h.kind==="openings"&&h.item.type==="door"&&tool==="door"){push();h.item.sw=(h.item.sw+1)%4;sel=h;}
    else{const n=nearestWall(p); if(n){const L=wlen(n.w),w=tool==="door"?3:4,m=(w/2)/L; push(); const o={id:uid(),wall:n.w.id,t:Math.max(m,Math.min(1-m,n.t)),type:tool,w:L<w?L*.8:w,sw:0}; f.openings.push(o); sel={kind:"openings",item:o};}}
    renderProps(); draw();
  }
  else if(tool==="place"){const s=SYM[placeK]; push(); const it={id:uid(),k:placeK,x:snap(p.x),y:snap(p.y),w:s.w,d:s.d,rot:ghostRot}; f.items.push(it); sel={kind:"items",item:it}; renderProps(); draw();}
  else if(tool==="dim"){const a=snapPoint(p);drag={type:"dim",a,b:a};}
  else if(tool==="autoroom"){
    const pts=autoRoom(p);
    if(!pts||pts==="open"){$("hint").textContent=t("noroom");}
    else{push();const r={id:uid(),pts,name:t("nameDef"),ceil:9,fill:lastFill,showDims:true};f.rooms.push(r);sel={kind:"rooms",item:r};renderProps();$("hint").textContent=t("h_autoroom");}
    draw();
  }
  else if(tool==="text"){openText(p,null);}
  else if(tool==="erase"){const h=hit(p); if(h){push();removeItem(h);renderProps();draw();}}
  else if(tool==="select"){
    const h=hit(p); sel=h; renderProps();
    if(h){
      const pre=JSON.stringify(doc);
      if(h.kind==="walls"){ const w=h.item; if(near([w.x1,w.y1],q))drag={type:"end",n:1,w,pre}; else if(near([w.x2,w.y2],q))drag={type:"end",n:2,w,pre}; }
      if(!drag&&h.kind==="rooms"){ const i=h.item.pts.findIndex(pt=>near(pt,q)); if(i>=0)drag={type:"vertex",i,r:h.item,pre}; }
      if(!drag&&h.kind!=="openings") drag={type:"move",h,start:{x:p.x,y:p.y},orig:clone(h.item),pre,moved:false};
    }
    draw();
  }
});

cv.addEventListener("pointermove",e=>{
  const p=toWorld(e),q=clientXY(e);
  if(drag){
    if(drag.type==="pan"){view.ox=drag.ox+e.clientX-drag.sx;view.oy=drag.oy+e.clientY-drag.sy;}
    else if(drag.type==="wall"||drag.type==="dim"){drag.b=orthoEnd(drag.a,snapPoint(p));}
    else if(drag.type==="room"){drag.b={x:snap(p.x),y:snap(p.y)}; if(Math.hypot(q.x-drag.sx,q.y-drag.sy)>6)drag.moved=true;}
    else{
      if(!drag.did){pushSnap(drag.pre);drag.did=true;}
      if(drag.type==="end"){const w=drag.w,o=drag.n===1?{x:w.x2,y:w.y2}:{x:w.x1,y:w.y1},s=orthoEnd(o,snapPoint(p)); w["x"+drag.n]=s.x;w["y"+drag.n]=s.y;}
      else if(drag.type==="vertex"){drag.r.pts[drag.i]=[snap(p.x),snap(p.y)];}
      else if(drag.type==="move"){
        const dx=snap(p.x-drag.start.x),dy=snap(p.y-drag.start.y),o=drag.orig,it=drag.h.item;
        if(drag.h.kind==="walls"){it.x1=o.x1+dx;it.y1=o.y1+dy;it.x2=o.x2+dx;it.y2=o.y2+dy;}
        else if(drag.h.kind==="dims"){it.x1=o.x1+dx;it.y1=o.y1+dy;it.x2=o.x2+dx;it.y2=o.y2+dy;}
        else if(drag.h.kind==="rooms"){it.pts=o.pts.map(pt=>[pt[0]+dx,pt[1]+dy]);}
        else{it.x=o.x+dx;it.y=o.y+dy;}
      }
    }
  } else if(tool==="wall"||tool==="room"||tool==="dim"){hover=snapPoint(p);}
  else if(tool==="place"){hover={x:snap(p.x),y:snap(p.y)};}
  else if(tool==="door"||tool==="window"){const n=nearestWall(p);hover=n?{sw:{x:n.w.x1+(n.w.x2-n.w.x1)*n.t,y:n.w.y1+(n.w.y2-n.w.y1)*n.t}}:null;}
  else hover=null;
  draw();
});

cv.addEventListener("pointerup",e=>{
  const f=F();
  if(drag&&drag.type==="wall"){const {a,b}=drag; if(Math.hypot(b.x-a.x,b.y-a.y)>=.25){push();const w={id:uid(),x1:a.x,y1:a.y,x2:b.x,y2:b.y,th:.5};f.walls.push(w);sel={kind:"walls",item:w};}}
  else if(drag&&drag.type==="dim"){const {a,b}=drag; if(Math.hypot(b.x-a.x,b.y-a.y)>=.25){push();const d={id:uid(),x1:a.x,y1:a.y,x2:b.x,y2:b.y,off:2.5};f.dims.push(d);sel={kind:"dims",item:d};}}
  else if(drag&&drag.type==="room"){
    const {a,b}=drag;
    if(drag.moved&&Math.abs(b.x-a.x)>=1&&Math.abs(b.y-a.y)>=1){ push(); const r={id:uid(),pts:[[a.x,a.y],[b.x,a.y],[b.x,b.y],[a.x,b.y]],name:t("nameDef"),ceil:9,fill:lastFill,showDims:true}; f.rooms.push(r); sel={kind:"rooms",item:r}; }
    else if(!drag.moved){
      const p=hover||a;
      if(polyPts.length>=3&&near(polyPts[0],clientXY(e),12)) closePoly();
      else polyPts.push([p.x,p.y]);
    }
  }
  else if(drag&&drag.type==="pan"){cv.style.cursor=tool==="pan"?"grab":"default";}
  else if(drag&&drag.did){persist();}
  drag=null; renderProps(); draw();
});
cv.addEventListener("pointerleave",()=>{hover=null;if(!drag)draw();});
function closePoly(){
  if(polyPts.length<3){polyPts=[];return;}
  push(); const r={id:uid(),pts:polyPts.slice(),name:t("nameDef"),ceil:9,fill:lastFill,showDims:true}; F().rooms.push(r); sel={kind:"rooms",item:r}; polyPts=[]; renderProps(); draw();
}
cv.addEventListener("wheel",e=>{
  autoFit=false; e.preventDefault(); const q=clientXY(e),k=Math.exp(-e.deltaY*.0015),ns=Math.max(2,Math.min(120,view.s*k));
  view.ox=q.x-(q.x-view.ox)*ns/view.s; view.oy=q.y-(q.y-view.oy)*ns/view.s; view.s=ns; draw();
},{passive:false});
cv.addEventListener("dblclick",e=>{const h=hit(toWorld(e)); if(h&&h.kind==="labels")openText(null,h.item);});

function removeItem(h){
  const f=F();
  if(h.kind==="walls"){f.walls=f.walls.filter(w=>w!==h.item);f.openings=f.openings.filter(o=>o.wall!==h.item.id);}
  else f[h.kind]=f[h.kind].filter(x=>x!==h.item);

/* text editor */
function openText(p,label){
  editing=label||{id:uid(),x:snap(p.x),y:snap(p.y),text:"",size:1,isNew:true};
  const s=scr(editing.x,editing.y); tb.style.display="block"; tb.style.left=(s.x-70)+"px"; tb.style.top=(s.y-16)+"px"; tb.value=editing.text; setTimeout(()=>{tb.focus();tb.select();},0);
}
function hideText(){tb.style.display="none";editing=null;}
function commitText(){
  if(!editing)return; const e=editing,v=tb.value.trim(); editing=null; tb.style.display="none";
  if(e.isNew){if(v){push();delete e.isNew;e.text=v;F().labels.push(e);sel={kind:"labels",item:e};}}
  else if(v&&v!==e.text){push();e.text=v;}
  renderProps();draw();
}
tb.addEventListener("keydown",e=>{if(e.key==="Enter")commitText();if(e.key==="Escape")hideText();e.stopPropagation();});
tb.addEventListener("blur",()=>{if(editing)commitText();});

/* keyboard */
window.addEventListener("keydown",e=>{
  if(e.target.matches("input,select,textarea")) return;
  if(mode==="3d"||$("dlgback").style.display==="flex"||$("home").style.display==="flex") return;
  if(e.key==="Shift")shiftDown=true;
  if(e.key===" "){spaceDown=true;e.preventDefault();}
  const k=e.key.toLowerCase();
  if((e.metaKey||e.ctrlKey)&&k==="z"){e.preventDefault();e.shiftKey?redo():undo();return;}
  if((e.metaKey||e.ctrlKey)&&k==="y"){e.preventDefault();redo();return;}
  if((e.metaKey||e.ctrlKey)&&k==="d"){e.preventDefault();duplicate();return;}
  if(sel&&tool==="select"&&e.key.startsWith("Arrow")){ e.preventDefault(); push(); const s=snapV*(e.shiftKey?4:1), dx=e.key==="ArrowLeft"?-s:e.key==="ArrowRight"?s:0, dy=e.key==="ArrowUp"?-s:e.key==="ArrowDown"?s:0, it=sel.item;
    if(sel.kind==="walls"||sel.kind==="dims"){it.x1+=dx;it.x2+=dx;it.y1+=dy;it.y2+=dy;} else if(sel.kind==="rooms"){it.pts=it.pts.map(q=>[q[0]+dx,q[1]+dy]);} else if(sel.kind!=="openings"){it.x+=dx;it.y+=dy;}
    renderProps(); draw(); return; }
  if((k==="delete"||k==="backspace")&&sel){push();removeItem(sel);renderProps();draw();return;}
  if(e.key==="Enter"&&tool==="room"){closePoly();return;}
  if(e.key==="Escape"){drag=null;polyPts=[];if(tool==="place")setTool("select");else{sel=null;renderProps();draw();}return;}
  if(k==="r"&&!e.metaKey&&!e.ctrlKey){ if(tool==="place"){ghostRot=(ghostRot+90)%360;draw();} else if(sel&&sel.kind==="items"){push();sel.item.rot=(sel.item.rot+90)%360;renderProps();draw();} return; }
  const map={v:"select",w:"wall",d:"door",n:"window",a:"room",t:"text",e:"erase",h:"pan"};
  if(!e.metaKey&&!e.ctrlKey&&map[k])setTool(map[k]);
});
window.addEventListener("keyup",e=>{if(e.key==="Shift")shiftDown=false;if(e.key===" ")spaceDown=false;});
function duplicate(){
  if(!sel||!["items","rooms","labels"].includes(sel.kind))return; push(); const c=clone(sel.item); c.id=uid();
  if(c.pts)c.pts=c.pts.map(p=>[p[0]+2,p[1]+2]); else{c.x+=2;c.y+=2;}
  F()[sel.kind].push(c); sel={kind:sel.kind,item:c}; renderProps(); draw();
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const row=(l,h)=>`<label class="row"><span>${l}</span>${h}</label>`;
const lenIn=(f,v)=>`<input data-f="${f}" data-len="1" value="${esc(fmt(v))}">`;

function renderProps(){
  const el=$("props"), f=F(); let h="";
  if(!sel){
    h=`<h3>${t("p_project")}</h3>`+row(t("p_pname"),`<input data-f="pname" value="${esc(doc.meta.project)}">`)+row(t("p_addr"),`<input data-f="paddr" value="${esc(doc.meta.address)}">`)+row(t("p_author"),`<input data-f="pauthor" value="${esc(doc.meta.author)}">`)

     +`<label class="row inline"><span>${t("p_title")}</span><input type="checkbox" data-f="showTitle" ${f.showTitle?"checked":""}></label>`
     +row(t("p_units"),`<select data-f="unit"><option value="imp" ${doc.unit==="imp"?"selected":""}>${t("imp")}</option><option value="met" ${doc.unit==="met"?"selected":""}>${t("met")}</option></select>`)
     +`<div class="row"><span>${t("p_area")}</span><span class="ro">${fmtArea(totalArea(f))}</span></div>`

    else if(sel.kind==="rooms"){ const b=bbox(it.pts);
      h=`<h3>${t("p_room")}</h3>`+row(t("p_name"),`<input data-f="name" value="${esc(it.name)}">`)+row(t("p_ceil"),lenIn("ceil",it.ceil||0))
       +`<span class="note">${t("p_fill")}</span><div class="sw">${SW.map(c=>`<i data-fill="${c}" style="background:${c}"></i>`).join("")}</div><input type="color" data-f="fill" value="${esc(it.fill)}" style="margin-bottom:9px">`
       +`<label class="row inline"><span>${t("p_showdims")}</span><input type="checkbox" data-f="showDims" ${it.showDims?"checked":""}></label>`
       +`<div class="row"><span>${t("p_roomarea")}</span><span class="ro">${fmtArea(polyArea(it.pts))}</span></div><div class="row"><span class="ro">${fmt(b.x2-b.x1)} x ${fmt(b.y2-b.y1)}</span></div>`
       +`<div class="btns"><button id="dup">${t("p_dup")}</button></div>`+delBtn(); }
    else if(sel.kind==="dims") h=`<h3>${t("p_dimension")}</h3>`+`<div class="row"><span>${t("p_len")}</span><span class="ro">${fmt(dimGeom(it).L)}</span></div>`+row(t("p_off"),lenIn("off",Math.abs(it.off||0)))+`<div class="btns"><button id="flipdim">${t("p_flip")}</button></div>`+delBtn();

  }

const delBtn=()=>`<div class="btns" style="margin-top:10px"><button id="del">${t("p_del")}</button></div>`;

$("props").addEventListener("click",e=>{

  if(b.id==="del"){push();removeItem(sel);renderProps();draw();}

$("props").addEventListener("change",e=>{

/* ================= toolbar ================= */
function syncUnits(){
  const opts=doc.unit==="met"?[[5,"5 cm"],[10,"10 cm"],[25,"25 cm"],[50,"50 cm"]].map(([c,l])=>[c/30.48,l]):[[.25,'3"'],[.5,'6"'],[1,"1'"]];
  const cur=snapV; $("snap").innerHTML=opts.map(([v,l])=>`<option value="${v}">${l}</option>`).join("");
  let idx=opts.findIndex(o=>Math.abs(o[0]-cur)<1e-3); if(idx<0)idx=1; $("snap").selectedIndex=idx; snapV=opts[idx][0];

function fit(){

  if(!b){view={s:14,ox:W/2-280,oy:H/2-200};draw();return;}
  const bw=b.x2-b.x1+4,bh=b.y2-b.y1+10,s=Math.max(2,Math.min(60,Math.min((W-60)/bw,(H-60)/bh)));
  view={s,ox:(W-(b.x2-b.x1)*s)/2-b.x1*s,oy:30-(b.y1)*s+ (H-60-(b.y2-b.y1+8)*s)/2};

function exportCanvas(){
  const f=F(),b=contentBounds(f); if(!b)return null; const m=5,x1=b.x1-m,y1=b.y1-m,x2=b.x2+m,y2=b.y2+m+8,w=x2-x1,h=y2-y1,s=Math.min(30,4000/Math.max(w,h));

function normalize(d){

  g.beginPath(); g.moveTo(x,y); g.lineTo(x+w,y); g.stroke(); g.font=`700 ${fs}px sans-serif`; g.textAlign="left"; g.fillText(t("pr_total"),x+.06*dpi,y+rh/2); g.textAlign="right"; g.fillText(fmtArea(totalArea(f)).replace(" SQFT"," SF"),x+w-.06*dpi,y+rh/2);
  g.restore();
}
function drawTitleBlock(g,fx,fy,fw,fh,tbH,f,scale,fi,dpi,ink,sub){
  const y=fy+fh-tbH, I=x=>x*dpi, m=doc.meta; g.save(); g.strokeStyle=ink; g.fillStyle=ink; g.lineWidth=Math.max(1.5,I(.02));
  g.beginPath(); g.moveTo(fx,y); g.lineTo(fx+fw,y); g.moveTo(fx+fw*.5,y); g.lineTo(fx+fw*.5,y+tbH); g.moveTo(fx+fw*.78,y); g.lineTo(fx+fw*.78,y+tbH); g.stroke();
  g.textBaseline="alphabetic"; g.textAlign="left";

  g.font=`${I(.12)}px sans-serif`; if(m.address) g.fillText(m.address.slice(0,60),fx+I(.15),y+I(.64));
  const sm=I(.075); g.font=`700 ${sm}px sans-serif`; g.fillText(t("pr_sheet"),fx+fw*.5+I(.12),y+I(.16)); g.fillText(t("pr_scale_l"),fx+fw*.5+I(.12),y+tbH*.62);
  g.font=`700 ${I(.2)}px sans-serif`; g.fillText((f.name+" "+sub).toUpperCase().slice(0,34),fx+fw*.5+I(.12),y+I(.42));
  g.font=`${I(.13)}px sans-serif`; g.fillText(scale,fx+fw*.5+I(.12),y+tbH*.62+I(.2));
  g.font=`700 ${sm}px sans-serif`; g.fillText(t("pr_date"),fx+fw*.78+I(.12),y+I(.16)); g.fillText(t("pr_by"),fx+fw*.78+I(.12),y+tbH*.5);
  g.font=`${I(.13)}px sans-serif`; g.fillText(new Date().toLocaleDateString(),fx+fw*.78+I(.12),y+I(.34)); g.fillText((m.author||"").slice(0,22),fx+fw*.78+I(.12),y+tbH*.5+I(.2));
  g.font=`700 ${I(.3)}px sans-serif`; g.textAlign="right"; g.fillText("A-"+(fi+1),fx+fw-I(.15),y+tbH-I(.14));
  g.restore();
}
function renderSheet(view,fi,o,dpi){
  const [pw,ph]=paperDims(o), W=Math.round(pw*dpi), H=Math.round(ph*dpi), cn=document.createElement("canvas"); cn.width=W; cn.height=H;
  const g=cn.getContext("2d"), I=x=>x*dpi, ink=o.bp?"#ffffff":"#000000"; g.fillStyle=o.bp?"#0b3a7a":"#ffffff"; g.fillRect(0,0,W,H);
  const mg=Math.min(pw,ph)<10?.3:.5, k=dpi/96; g.strokeStyle=ink; g.fillStyle=ink; g.lineWidth=Math.max(2,I(.03)); g.strokeRect(I(mg),I(mg),W-2*I(mg),H-2*I(mg));
  const fx=I(mg),fy=I(mg),fw=W-2*I(mg),fh=H-2*I(mg), tbH=o.tb?I(Math.max(.85,Math.min(1.25,ph*.07))):0, schW=(o.sched&&view==="2d")?I(Math.max(2.3,Math.min(3.3,pw*.2))):0;
  const ax=fx+I(.12),ay=fy+I(.12),aw=fw-I(.24)-schW,ah=fh-I(.24)-tbH;
  const prev=doc.cur; doc.cur=fi; const f=F(); let fits=true, label="", sub=t("pr_plan"), ppfPx=0;
  try{
    if(view==="2d"){
      const cb=contentBounds(f);
      if(cb){
        const m=o.overall?6:3, bw=cb.x2-cb.x1, bh=cb.y2-cb.y1; let s;
        if(o.scale==="fit"){ s=Math.min(aw/(bw+2*m),ah/(bh+2*m)); label=t("pr_asnoted"); } else { s=parseFloat(o.scale)*dpi; fits=(bw+2*m)*s<=aw&&(bh+2*m)*s<=ah; label=scaleLabel(o.scale); }
        ppfPx=s; const v={s,ox:ax+(aw-bw*s)/2-cb.x1*s,oy:ay+(ah-bh*s)/2-cb.y1*s}, P=o.bp?BPP:LIGHT;
        g.save(); g.beginPath(); g.rect(ax,ay,aw,ah); g.clip();
        render(g,W,H,v,P,false,{noBg:true,noTitle:true,lw:k,nameFont:I(.1),dimFont:I(.085),wallDims:o.walldims});
        const wb=wallsBox(f);
        if(o.overall&&wb){ const ro={dimFont:I(.095)}; drawDim(g,{x1:wb.x1,y1:wb.y1,x2:wb.x2,y2:wb.y1,off:-4},v,P,P.ink,k,ro); drawDim(g,{x1:wb.x1,y1:wb.y1,x2:wb.x1,y2:wb.y2,off:4},v,P,P.ink,k,ro); }
        g.restore();
        if(o.north){ drawNorth(g,ax+aw-I(.7),ay+I(.95),I(.28),ink,k); drawScaleBar(g,ax+I(.3),ay+ah-I(.35),s,ink,dpi); }
      } else { g.font=`${I(.2)}px sans-serif`; g.textAlign="center"; g.fillText(t("pr_none"),ax+aw/2,ay+ah/2); }
      if(schW) { g.save(); g.lineWidth=Math.max(1.5,I(.015)); g.strokeStyle=ink; g.strokeRect(fx+fw-schW,fy+I(.12),schW-I(.12),ah); drawSchedule(g,fx+fw-schW,fy+I(.12),schW-I(.12),fy+I(.12)+ah,f,dpi,ink); g.restore(); }
    } else {
      const im=render3DCanvas(Math.max(400,Math.round(aw)),Math.max(300,Math.round(ah))); sub="3D"; label=t("pr_asnoted");
      if(im) g.drawImage(im,ax,ay,aw,ah); g.strokeStyle=ink; g.lineWidth=Math.max(1,k); g.strokeRect(ax,ay,aw,ah);
    }
  } finally { doc.cur=prev; }
  if(o.tb) drawTitleBlock(g,fx,fy,fw,fh,tbH,f,label,fi,dpi,ink,sub);
  return {cn,fits,pw,ph};
}
function readPrintOpts(){ return {paper:$("pp").value,land:$("po").value==="1",view:$("pv").value,scale:$("ps").value,what:$("pw").value,tb:$("ctb").checked,sched:$("csch").checked,north:$("cnr").checked,overall:$("cov").checked,walldims:$("cwd").checked,bp:$("cbp").checked}; }
const sheetList=o=>(o.what==="all"&&o.view==="2d")?doc.floors.map((_,i)=>i):[doc.cur];
let pvTimer=null;
function updatePreview(){
  clearTimeout(pvTimer); pvTimer=setTimeout(()=>{
    const o=readPrintOpts(), [pw,ph]=paperDims(o), dpi=Math.min(100,1200/Math.max(pw,ph)); $("ps").disabled=o.view==="3d";
    const sh=renderSheet(o.view,doc.cur,o,dpi), pvc=$("pvc"); pvc.width=sh.cn.width; pvc.height=sh.cn.height; pvc.getContext("2d").drawImage(sh.cn,0,0);
    $("pnote").textContent=o.view==="2d"?(sh.fits?t("pr_fitok"):t("pr_nofit")):""; $("pnote").style.color=sh.fits?"":"#d93025";
  },80);
}
function openPrint(){ buildPrintSelects(); $("dlgback").style.display="flex"; updatePreview(); }
function closePrint(){ $("dlgback").style.display="none"; }
function makeSheets(){ const o=readPrintOpts(), [pw,ph]=paperDims(o), dpi=Math.min(150,7000/Math.max(pw,ph)); return {o,pw,ph,sheets:sheetList(o).map(i=>({i,r:renderSheet(o.view,i,o,dpi)}))}; }
document.querySelectorAll("#dlg select, #dlg input").forEach(n=>n.addEventListener("change",updatePreview));
$("dclose").onclick=closePrint; $("dlgback").addEventListener("pointerdown",e=>{ if(e.target===$("dlgback")) closePrint(); });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&$("dlgback").style.display==="flex") closePrint(); });
$("doprint").onclick=async()=>{
  const {pw,ph,sheets}=makeSheets(), area=$("printarea"); area.innerHTML="";
  let st=document.getElementById("pagecss"); if(!st){st=document.createElement("style");st.id="pagecss";document.head.appendChild(st);} st.textContent=`@page{size:${pw}in ${ph}in;margin:0}`;
  const imgs=sheets.map(s=>{const im=new Image(); im.src=s.r.cn.toDataURL("image/png"); area.appendChild(im); return im;});
  try{ await Promise.all(imgs.map(im=>im.decode())); }catch{}
  closePrint(); setTimeout(()=>window.print(),50);

window.addEventListener("afterprint",()=>{ $("printarea").innerHTML=""; });
$("dopdf").onclick=async()=>{
  const {pw,ph,sheets,o}=makeSheets();
  if(window.native&&window.native.savePDF){ const res=await window.native.savePDF({images:sheets.map(s=>s.r.cn.toDataURL("image/png")),pw,ph,name:(doc.meta.project||"blueprint")}); if(res&&res.ok) $("pnote").textContent=t("pr_saved")+": "+res.path; }
  else $("doprint").click();

$("dopng").onclick=()=>{ const {sheets}=makeSheets(); sheets.forEach((s,n)=>s.r.cn.toBlob(b=>download(b,`blueprint-${n+1}.png`))); };

/* ================= project library ================= */
const store=(()=>{const mem={};return{
  get:k=>{try{const v=localStorage.getItem(k);if(v!==null)return v;}catch{}return k in mem?mem[k]:null;},
  set:(k,v)=>{mem[k]=v;try{localStorage.setItem(k,v);}catch{}},
  del:k=>{delete mem[k];try{localStorage.removeItem(k);}catch{}}};})();
let index=[], curId=null, renaming=null;
function loadIndex(){ try{index=JSON.parse(store.get("bpm-index")||"[]");}catch{index=[];} if(!Array.isArray(index))index=[]; }
const saveIndex=()=>store.set("bpm-index",JSON.stringify(index));
const newPid=()=>"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function loadDoc(id){ try{const d=JSON.parse(store.get("bpm-doc-"+id)); if(d&&d.floors&&d.floors.length)return normalize(d);}catch{} return null; }
function saveCurrent(){
  if(!curId||!doc)return; store.set("bpm-doc-"+curId,JSON.stringify(doc));
  const e=index.find(p=>p.id===curId); if(e){e.name=doc.meta.project||"Untitled";e.updated=Date.now();} saveIndex(); store.set("bpm-current",curId);
}
function addProject(d,name){ normalize(d); d.meta.project=name; const id=newPid(); index.unshift({id,name,updated:Date.now()}); store.set("bpm-doc-"+id,JSON.stringify(d)); saveIndex(); return id; }
function createProject(name,tpl){
  const d=tpl==="sample"?sample():{unit:"imp",cur:0,meta:{project:name,address:"",author:""},floors:[blankFloor("Main floor")]};
  return addProject(d,name);
}
function importFile(text,fname){
  let d=JSON.parse(text);
  if(d.walls&&!d.floors) d={unit:"imp",cur:0,floors:[Object.assign(blankFloor("Floor 1"),{walls:d.walls,openings:d.openings||[],labels:d.labels||[]})]};
  if(!d.floors||!d.floors.length) throw 0;
  d.meta=d.meta||{}; const name=d.meta.project&&d.meta.project!=="My House"?d.meta.project:(fname||"Imported").replace(/\.json$/i,"");
  return addProject(d,name);
}
function openProject(id){
  saveCurrent(); const d=loadDoc(id); if(!d)return;
  curId=id; doc=d; undoS=[];redoS=[];sel=null;polyPts=[];drag=null;hideText();
  if(mode==="3d")setMode("2d");
  syncUnits();floorsBar();renderProps();buttons();$("projname").value=doc.meta.project; autoFit=true; fit(); store.set("bpm-current",id); hideHome(); setTool("select");
}
function cardData(d){
  const prev=doc; doc=d; let img="",area="",rooms=0;
  try{
    const cn=document.createElement("canvas"); cn.width=360; cn.height=240; const g=cn.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,360,240);
    const f=d.floors[Math.min(d.cur,d.floors.length-1)], cb=contentBounds(f);
    if(cb){ const bw=cb.x2-cb.x1+4,bh=cb.y2-cb.y1+4,s=Math.min(330/bw,210/bh); const save=doc.cur; doc.cur=Math.min(d.cur,d.floors.length-1);
      render(g,360,240,{s,ox:(360-(cb.x2-cb.x1)*s)/2-cb.x1*s,oy:(240-(cb.y2-cb.y1)*s)/2-cb.y1*s},LIGHT,false,{noBg:true,noTitle:true,nameFont:7}); doc.cur=save; }
    img=cn.toDataURL("image/png"); area=fmtArea(d.floors.reduce((a,f)=>a+totalArea(f),0)); rooms=d.floors.reduce((a,f)=>a+f.rooms.length,0);
  } finally { doc=prev; }
  return {img,area,rooms};
}
function renderHome(){
  const list=index.slice().sort((a,b)=>b.updated-a.updated); $("hback").style.display=curId&&index.some(p=>p.id===curId)?"":"none";
  if(!list.length){ $("hgrid").innerHTML=`<p class="note">${t("pj_empty")}</p>`; return; }
  $("hgrid").innerHTML=list.map(p=>{
    const d=(p.id===curId)?doc:loadDoc(p.id); if(!d) return "";
    const c=cardData(d), when=new Date(p.updated).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
    const nameHtml=renaming===p.id?`<input data-name="${p.id}" value="${esc(p.name)}" type="text" aria-label="Project name">`:`<div class="pn">${esc(p.name)}</div>`;
    const btns=renaming===p.id?`<button data-act="saveren" data-id="${p.id}" class="on">${t("pj_save")}</button>`:
      `<button data-act="open" data-id="${p.id}" class="on">${t("pj_open")}</button><button data-act="ren" data-id="${p.id}">${t("pj_ren")}</button><button data-act="dup" data-id="${p.id}">${t("pj_dup")}</button><button data-act="export" data-id="${p.id}">${t("pj_exp")}</button><button data-act="del" data-id="${p.id}">${t("pj_del")}</button>`;
    return `<article class="pcard${p.id===curId?" cur":""}"><img data-act="open" data-id="${p.id}" src="${c.img}" alt="${esc(p.name)}">
      <div class="pb">${nameHtml}<div class="pm">${d.floors.length} ${t("pj_floors")} · ${c.rooms} ${t("pj_rooms")} · ${c.area}</div><div class="pm">${t("pj_edited")} ${when}</div><div class="btns">${btns}</div></div></article>`;
  }).join("");
}
function showHome(){ saveCurrent(); renaming=null; renderHome(); $("home").style.display="flex"; }
function hideHome(){ $("home").style.display="none"; }
$("homebtn").onclick=showHome; $("hback").onclick=hideHome;
function createFromForm(){
  const name=$("hname").value.trim()||(t("pj_def")+" "+(index.length+1)); const id=createProject(name,$("htpl").value); $("hname").value=""; openProject(id);
}
$("hcreate").onclick=createFromForm; $("hname").addEventListener("keydown",e=>{ if(e.key==="Enter")createFromForm(); });
$("himport").onclick=()=>$("hfile").click();
$("hfile").onchange=async e=>{ const fl=e.target.files[0]; if(!fl)return; try{ openProject(importFile(await fl.text(),fl.name)); }catch{ $("hgrid").insertAdjacentHTML("beforebegin",`<p class="note">Could not read that file.</p>`); } e.target.value=""; };
$("hgrid").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b)return; const id=b.dataset.id, act=b.dataset.act, p=index.find(x=>x.id===id); if(!p)return;
  if(act==="open") openProject(id);
  else if(act==="ren"){ renaming=id; renderHome(); const inp=document.querySelector(`[data-name="${id}"]`); if(inp){inp.focus();inp.select();} }
  else if(act==="saveren"){ commitRename(id); }
  else if(act==="dup"){ const d=loadDoc(id)||doc; const c=clone(d); const nid_=addProject(c,(p.name||"Project")+" copy"); renderHome(); }
  else if(act==="export"){ const d=(id===curId)?doc:loadDoc(id); if(d) download(new Blob([JSON.stringify(d,null,2)],{type:"application/json"}),(p.name||"project").replace(/[\\/:*?"<>|]/g,"_")+".json"); }
  else if(act==="del"){
    if(!b.dataset.armed){ b.dataset.armed="1"; b.textContent=t("pj_delc"); b.classList.add("on"); return; }
    index=index.filter(x=>x.id!==id); store.del("bpm-doc-"+id); saveIndex(); if(id===curId){curId=null;} renderHome();
  }
});
$("hgrid").addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.dataset.name) commitRename(e.target.dataset.name); });
function commitRename(id){
  const inp=document.querySelector(`[data-name="${id}"]`), v=inp?inp.value.trim():""; const p=index.find(x=>x.id===id);
  if(p&&v){ p.name=v; if(id===curId){doc.meta.project=v;$("projname").value=v;saveCurrent();} else { const d=loadDoc(id); if(d){d.meta.project=v;store.set("bpm-doc-"+id,JSON.stringify(d));} } saveIndex(); }
  renaming=null; renderHome();
}
$("projname").addEventListener("change",e=>{ const v=e.target.value.trim(); if(v){ doc.meta.project=v; saveCurrent(); renderProps(); } else e.target.value=doc.meta.project; });
$("projname").addEventListener("keydown",e=>{ e.stopPropagation(); if(e.key==="Enter") e.target.blur(); });

/* ================= start ================= */
loadIndex();
try{ const old=localStorage.getItem("blueprint-maker-2"); if(old&&!index.length){ const d=JSON.parse(old); if(d.floors&&d.floors.length){ const id=addProject(d,(d.meta&&d.meta.project)||"My House"); store.set("bpm-current",id); } localStorage.removeItem("blueprint-maker-2"); } }catch{}
if(!index.length){ const id=createProject("My House","sample"); store.set("bpm-current",id); }
{ const last=store.get("bpm-current"); let id=index.some(p=>p.id===last)?last:index[0].id; doc=loadDoc(id); if(!doc){ id=createProject("My House","sample"); doc=loadDoc(id); } curId=id; }
syncUnits(); buildTools(); floorsBar(); buttons(); $("projname").value=doc.meta.project;
new ResizeObserver(resize).observe(cv);
resize(); fit(); setTool("select");
showHome();
</script>
