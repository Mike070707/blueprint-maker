<style>

          --paper:#ffffff; --grid:#eef1f5; --grid-major:#d9dfe8; --ink:#1a1d22; --dim:#1f5eff; --sel:#ff6a00; }
  @media (prefers-color-scheme: dark) { :root { --ui-bg:#17191d; --ui-fg:#ececec; --ui-muted:#9aa1ad; --ui-line:#33373f; --ui-card:#22252b; --ui-accent:#6ea0ff;
          --paper:#1f2228; --grid:#262a31; --grid-major:#353b45; --ink:#f0f0f0; --dim:#6ea0ff; --sel:#ff9a4d; } }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--ui-bg); color:var(--ui-fg); font:13px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif; display:flex; flex-direction:column; overflow:hidden; }
  button, select, input { font:inherit; color:var(--ui-fg); }
  button, select { background:var(--ui-card); border:1px solid var(--ui-line); border-radius:7px; padding:5px 9px; cursor:pointer; }
  button:hover { border-color:var(--ui-accent); }
  button[aria-pressed=true], button.on { background:var(--ui-accent); border-color:var(--ui-accent); color:#fff; }
  button:disabled { opacity:.4; cursor:default; }
  :focus-visible { outline:2px solid var(--ui-accent); outline-offset:1px; }
  input[type=text], input:not([type]) { background:var(--ui-card); border:1px solid var(--ui-line); border-radius:6px; padding:5px 7px; width:100%; }
  header { display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:6px 10px; background:var(--ui-card); border-bottom:1px solid var(--ui-line); }
  header h1 { font-size:14px; margin:0 6px 0 0; }
  .grp { display:flex; gap:4px; align-items:center; }
  .sep { width:1px; height:22px; background:var(--ui-line); margin:0 3px; }
  #floors { display:flex; gap:4px; padding:6px 10px; background:var(--ui-bg); border-bottom:1px solid var(--ui-line); flex-wrap:wrap; }
  #main { flex:1; min-height:0; display:flex; }
  aside { background:var(--ui-card); overflow:auto; padding:10px; }
  #left { width:216px; border-right:1px solid var(--ui-line); }
  #props { width:250px; border-left:1px solid var(--ui-line); }
  aside h3 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ui-muted); margin:12px 0 6px; font-weight:600; }
  aside h3:first-child { margin-top:0; }
  .tools { display:grid; grid-template-columns:1fr 1fr; gap:4px; }
  .lib { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
  .lib button { padding:3px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10px; line-height:1.1; color:var(--ui-muted); }
  .lib button[aria-pressed=true] { color:#fff; }
  .lib canvas { width:56px; height:40px; background:#fff; border-radius:4px; }
  .row { display:flex; flex-direction:column; gap:3px; margin-bottom:9px; color:var(--ui-muted); font-size:12px; }
  .row.inline { flex-direction:row; align-items:center; justify-content:space-between; }
  .row input[type=checkbox] { width:auto; }
  .row input[type=color] { width:100%; height:30px; padding:2px; border:1px solid var(--ui-line); border-radius:6px; background:var(--ui-card); }
  .sw { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:9px; }
  .sw i { width:22px; height:22px; border-radius:5px; border:1px solid var(--ui-line); cursor:pointer; }
  .btns { display:flex; gap:4px; flex-wrap:wrap; }
  .ro { color:var(--ui-fg); font-weight:600; }
  .note { color:var(--ui-muted); font-size:12px; line-height:1.4; }
  #stage { position:relative; flex:1; min-width:0; }
  canvas#c { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; background:var(--paper); }
  #textbox { position:absolute; display:none; font-weight:600; padding:4px 8px; border:2px solid var(--sel); border-radius:6px; min-width:140px; width:auto; }
  footer { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; padding:5px 10px; background:var(--ui-card); border-top:1px solid var(--ui-line); color:var(--ui-muted); font-size:12px; }
  canvas#c3d { position:absolute; inset:0; width:100%; height:100%; display:none; cursor:grab; background:#cfe3f2; touch-action:none; }
  .ov { position:absolute; display:flex; gap:6px; z-index:5; }
  .ov button { box-shadow:0 1px 4px rgba(0,0,0,.25); }
  #ov3 { top:10px; left:10px; display:none; flex-wrap:wrap; }
  #zoomov { bottom:12px; right:12px; flex-direction:column; }
  #zoomov button { width:34px; height:34px; padding:0; font-size:18px; }
  #dlgback { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:50; }
  #dlg { background:var(--ui-card); border-radius:12px; width:min(1080px,95vw); height:min(760px,92vh); display:flex; overflow:hidden; }
  #dlg .opts { width:290px; padding:16px; overflow:auto; border-right:1px solid var(--ui-line); flex:none; }
  #dlg .prev { flex:1; padding:16px; background:var(--ui-bg); display:flex; flex-direction:column; gap:10px; min-width:0; min-height:0; }
  #dlg .pvbox { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  #dlg canvas { max-width:100%; max-height:100%; background:#fff; box-shadow:0 3px 16px rgba(0,0,0,.3); }
  #home { position:fixed; inset:0; background:var(--ui-bg); z-index:40; display:none; flex-direction:column; overflow:auto; }
  .hwrap { width:100%; max-width:1120px; margin:0 auto; padding:28px 20px 48px; }
  .hwrap h2 { font-size:26px; margin:0 0 4px; }
  .hnew { display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:var(--ui-card); border:1px solid var(--ui-line); border-radius:12px; padding:14px; margin:18px 0 22px; }
  .hnew input[type=text] { flex:1; min-width:200px; width:auto; }
  .hgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
  .pcard { background:var(--ui-card); border:1px solid var(--ui-line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
  .pcard.cur { border-color:var(--ui-accent); box-shadow:0 0 0 1px var(--ui-accent); }
  .pcard img { width:100%; height:160px; object-fit:contain; background:#fff; display:block; border-bottom:1px solid var(--ui-line); cursor:pointer; }
  .pcard .pb { padding:12px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .pcard .pn { font-size:15px; font-weight:700; overflow-wrap:anywhere; }
  .pcard .pm { color:var(--ui-muted); font-size:12px; }
  .pcard .btns { margin-top:auto; padding-top:6px; }
  .pcard input { font-weight:600; }
  #clear { display:none; }
  #projname { width:190px; font-weight:600; }
  #printarea { display:none; }
  @media print {
    body > *:not(#printarea) { display:none !important; }
    body { overflow:visible; display:block; background:#fff; }
    #printarea { display:block; }
    #printarea img { display:block; width:100%; page-break-after:always; }
    #printarea img:last-child { page-break-after:auto; }
  }
  [hidden] { display:none !important; }
</style>

<header id="top">

</header>
<div id="floors"></div>

<div id="main">

    <div id="libwrap"></div>

  <div id="stage">

</div>

  <span id="status"></span>
</footer>
<div id="printarea"></div>

    <input id="hname" type="text" aria-label="Project name" placeholder="Project name">

  </div>
  <div class="hgrid" id="hgrid"></div>
</div></div>
<div id="dlgback"><div id="dlg" role="dialog" aria-modal="true" aria-label="Print">

    <label class="row inline"><span data-i="pr_north">North arrow and scale bar</span><input type="checkbox" id="cnr" checked></label>

  </div>
</div></div>

/* ================= hit testing ================= */
function opening(o){ const w=wallById(o.wall); if(!w)return null; const L=wlen(w),dx=(w.x2-w.x1)/L,dy=(w.y2-w.y1)/L; return {w,L,dx,dy,cx:w.x1+dx*L*o.t,cy:w.y1+dy*L*o.t}; }
function itemLocal(it,p){ const a=it.rot*PI/180,dx=p.x-it.x,dy=p.y-it.y; return {x:dx*Math.cos(a)+dy*Math.sin(a), y:-dx*Math.sin(a)+dy*Math.cos(a)}; }
function labelBox(l){ const px=Math.max(l.size*view.s,7); ctx.font=`600 ${px}px sans-serif`; return {w:ctx.measureText(l.text).width/view.s, h:l.size*1.2}; }
function hit(p){
  const f=F();
  for(const it of [...f.items].reverse()){ const q=itemLocal(it,p); if(Math.abs(q.x)<=it.w/2&&Math.abs(q.y)<=it.d/2) return {kind:"items",item:it}; }
  for(const l of f.labels){ const b=labelBox(l); if(Math.abs(p.x-l.x)<b.w/2&&Math.abs(p.y-l.y)<b.h/2) return {kind:"labels",item:l}; }
  for(const d of f.dims){ const g=dimGeom(d),r=segDist(p.x,p.y,g.ax,g.ay,g.bx,g.by); if(r.d<Math.max(.4,6/view.s)) return {kind:"dims",item:d}; }
  for(const o of f.openings){ const g=opening(o); if(g&&Math.hypot(p.x-g.cx,p.y-g.cy)<Math.max(o.w/2,.6)) return {kind:"openings",item:o}; }
  let best=null,bd=Math.max(.45,8/view.s);
  for(const w of f.walls){const {d}=segDist(p.x,p.y,w.x1,w.y1,w.x2,w.y2); if(d<bd){bd=d;best={kind:"walls",item:w};}}
  if(best) return best;
  for(const r of [...f.rooms].reverse()) if(inPoly(p.x,p.y,r.pts)) return {kind:"rooms",item:r};
  return null;
}
function nearestWall(p){ let best=null,bd=Math.max(.8,14/view.s); for(const w of F().walls){const r=segDist(p.x,p.y,w.x1,w.y1,w.x2,w.y2); if(r.d<bd){bd=r.d;best={w,t:r.t};}} return best; }

}

function duplicate(){

  if(c.pts)c.pts=c.pts.map(p=>[p[0]+2,p[1]+2]); else{c.x+=2;c.y+=2;}

function fit(){
  const b=contentBounds(F()),W=cv.clientWidth,H=cv.clientHeight;
  if(paperView&&doc.sheet&&W>0){ const si=sheetInfo(doc),sh=doc.sheet,s=Math.max(2,Math.min(60,Math.min((W-40)/si.W,(H-40)/si.H))); view={s,ox:(W-si.W*s)/2-sh.x*s,oy:(H-si.H*s)/2-sh.y*s}; draw(); return; }
  if(!b){view={s:14,ox:W/2-280,oy:H/2-200};draw();return;}
  const bw=b.x2-b.x1+4,bh=b.y2-b.y1+10,s=Math.max(2,Math.min(60,Math.min((W-60)/bw,(H-60)/bh)));
  view={s,ox:(W-(b.x2-b.x1)*s)/2-b.x1*s,oy:30-(b.y1)*s+ (H-60-(b.y2-b.y1+8)*s)/2};
  draw();
}

function exportCanvas(){
  const f=F(),b=contentBounds(f); if(!b)return null; const m=5,x1=b.x1-m,y1=b.y1-m,x2=b.x2+m,y2=b.y2+m+8,w=x2-x1,h=y2-y1,s=Math.min(30,4000/Math.max(w,h));

  render(c.getContext("2d"),c.width,c.height,{s,ox:-x1*s,oy:-y1*s},bp?BPP:LIGHT,false); return c;
}

function sheetInfo(d){ const sh=d.sheet,[pw,ph]=paperDims({paper:sh.paper,land:sh.land,cw:sh.cw,ch:sh.ch}),mg=Math.min(pw,ph)<10?.3:.5,tbIn=Math.max(.85,Math.min(1.25,ph*.07)); return {pw,ph,ppf:sh.ppf,mg,tbIn,W:pw/sh.ppf,H:ph/sh.ppf}; }
function ensureSheet(d,force){
  d.sheet=Object.assign({paper:"archc",land:true,ppf:d.unit==="met"?.12:.25},d.sheet||{}); const sh=d.sheet;
  if(force||sh.x==null||sh.y==null){ const cb=contentBounds(d.floors[0]),si=sheetInfo(d),cx=cb?(cb.x1+cb.x2)/2:20,cy=cb?(cb.y1+cb.y2)/2:15,ah=si.ph-2*si.mg-si.tbIn; sh.x=cx-si.W/2; sh.y=cy-(si.mg+ah/2)/si.ppf; }
}
function normalize(d){
  d.unit=d.unit||"imp"; d.cur=Math.min(d.cur||0,d.floors.length-1); d.meta=Object.assign({project:"My House",address:"",author:""},d.meta||{});
  d.floors.forEach(f=>{for(const k of["walls","openings","labels","rooms","items","dims"])f[k]=f[k]||[]; f.name=f.name||"Floor"; if(f.showTitle===undefined)f.showTitle=true; f.wallH=f.wallH||9; f.id=f.id||0;});
  let m=1; d.floors.forEach(f=>{m=Math.max(m,f.id,...f.walls.map(x=>x.id||0),...f.openings.map(x=>x.id||0),...f.labels.map(x=>x.id||0),...f.rooms.map(x=>x.id||0),...f.items.map(x=>x.id||0),...f.dims.map(x=>x.id||0));}); nid=Math.max(nid,m);
  d.look=Object.assign({},LOOK_DEF,d.look||{}); ensureSheet(d); return d;
}

const TEXC={};
function ctex(key,w,h,draw,repeat){
  if(TEXC[key])return TEXC[key]; const cn=document.createElement("canvas"); cn.width=w; cn.height=h; draw(cn.getContext("2d"),w,h);
  const t=new THREE.CanvasTexture(cn); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=8; if(THREE.SRGBColorSpace)t.colorSpace=THREE.SRGBColorSpace; if(repeat)t.repeat.set(repeat,repeat); return TEXC[key]=t;
}
const speck=(g,w,h,n,col,a)=>{ for(let i=0;i<n;i++){ g.fillStyle=`rgba(${col},${Math.random()*a})`; g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2.5,1+Math.random()*2.5); } };
function wallTex(type,color){
  return ctex("wall|"+type+"|"+color,256,256,(g,w,h)=>{
    g.fillStyle=color; g.fillRect(0,0,w,h);
    if(type==="brick"){ g.fillStyle=shade(color,.55); g.fillRect(0,0,w,h); const rows=8,bh=h/rows,bw=w/3;
      for(let r=0;r<rows;r++)for(let c=-1;c<4;c++){ g.fillStyle=shade(color,(Math.random()-.5)*.28); g.fillRect(c*bw+(r%2?bw/2:0)+2,r*bh+2,bw-4,bh-4); } speck(g,w,h,500,"60,30,20",.12); }

      if(im) g.drawImage(im,ax,ay,aw,ah); g.strokeStyle=ink; g.lineWidth=Math.max(1,k); g.strokeRect(ax,ay,aw,ah);
    }
  } finally { doc.cur=prev; }
  if(o.tb) drawTitleBlock(g,fx,fy,fw,fh,tbH,f,label,fi,dpi,ink,sub);
  return {cn,fits,pw,ph};
}
function readPrintOpts(){ return {cw:parseFloat($("pcw").value)||36,ch:parseFloat($("pch").value)||24,paper:$("pp").value,land:$("po").value==="1",view:$("pv").value,scale:$("ps").value,what:$("pw").value,tb:$("ctb").checked,sched:$("csch").checked,north:$("cnr").checked,overall:$("cov").checked,walldims:$("cwd").checked,bp:$("cbp").checked}; }
const sheetList=o=>(o.what==="all"&&o.view==="2d")?doc.floors.map((_,i)=>i):[doc.cur];
let pvTimer=null;
function updatePreview(){
  clearTimeout(pvTimer); pvTimer=setTimeout(()=>{
    $("pcust").style.display=$("pp").value==="custom"?"":"none"; const o=readPrintOpts(), [pw,ph]=paperDims(o), dpi=Math.min(100,1200/Math.max(pw,ph)); $("ps").disabled=o.view==="3d";
    const sh=renderSheet(o.view,doc.cur,o,dpi), pvc=$("pvc"); pvc.width=sh.cn.width; pvc.height=sh.cn.height; pvc.getContext("2d").drawImage(sh.cn,0,0);
    $("pnote").textContent=o.view==="2d"?(sh.fits?t("pr_fitok"):t("pr_nofit")):""; $("pnote").style.color=sh.fits?"":"#d93025";
  },80);
}
function openPrint(){ buildPrintSelects(); $("pp").value=doc.sheet.paper; $("po").value=doc.sheet.land?"1":"0"; $("pcw").value=doc.sheet.cw||36; $("pch").value=doc.sheet.ch||24; if([...$("ps").options].some(o=>o.value===String(doc.sheet.ppf))) $("ps").value=String(doc.sheet.ppf); $("dlgback").style.display="flex"; updatePreview(); }
function closePrint(){ $("dlgback").style.display="none"; }
function makeSheets(){ const o=readPrintOpts(), [pw,ph]=paperDims(o), dpi=Math.min(150,7000/Math.max(pw,ph)); return {o,pw,ph,sheets:sheetList(o).map(i=>({i,r:renderSheet(o.view,i,o,dpi)}))}; }
document.querySelectorAll("#dlg select, #dlg input").forEach(n=>n.addEventListener("change",updatePreview));
$("dclose").onclick=closePrint; $("dlgback").addEventListener("pointerdown",e=>{ if(e.target===$("dlgback")) closePrint(); });
window.addEventListener("keydown",e=>{ if(e.key==="Escape"&&$("dlgback").style.display==="flex") closePrint(); });
$("doprint").onclick=async()=>{
  const {pw,ph,sheets}=makeSheets(), area=$("printarea"); area.innerHTML="";
  let st=document.getElementById("pagecss"); if(!st){st=document.createElement("style");st.id="pagecss";document.head.appendChild(st);} st.textContent=`@page{size:${pw}in ${ph}in;margin:0}`;
  const imgs=sheets.map(s=>{const im=new Image(); im.src=s.r.cn.toDataURL("image/png"); area.appendChild(im); return im;});
  try{ await Promise.all(imgs.map(im=>im.decode())); }catch{}
  closePrint(); setTimeout(()=>window.print(),50);
};
window.addEventListener("afterprint",()=>{ $("printarea").innerHTML=""; });
$("dopdf").onclick=async()=>{
  const {pw,ph,sheets,o}=makeSheets();
  if(window.native&&window.native.savePDF){ const res=await window.native.savePDF({images:sheets.map(s=>s.r.cn.toDataURL("image/png")),pw,ph,name:(doc.meta.project||"blueprint")}); if(res&&res.ok) $("pnote").textContent=t("pr_saved")+": "+res.path; }
  else $("doprint").click();
};
$("dopng").onclick=()=>{ const {sheets}=makeSheets(); sheets.forEach((s,n)=>s.r.cn.toBlob(b=>download(b,`blueprint-${n+1}.png`))); };

/* ================= project library ================= */
const store=(()=>{const mem={};return{
  get:k=>{try{const v=localStorage.getItem(k);if(v!==null)return v;}catch{}return k in mem?mem[k]:null;},
  set:(k,v)=>{mem[k]=v;try{localStorage.setItem(k,v);}catch{}},
  del:k=>{delete mem[k];try{localStorage.removeItem(k);}catch{}}};})();
let index=[], curId=null, renaming=null;
function loadIndex(){ try{index=JSON.parse(store.get("bpm-index")||"[]");}catch{index=[];} if(!Array.isArray(index))index=[]; }
const saveIndex=()=>store.set("bpm-index",JSON.stringify(index));
const newPid=()=>"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function loadDoc(id){ try{const d=JSON.parse(store.get("bpm-doc-"+id)); if(d&&d.floors&&d.floors.length)return normalize(d);}catch{} return null; }
function saveCurrent(){
  if(!curId||!doc)return; store.set("bpm-doc-"+curId,JSON.stringify(doc));
  const e=index.find(p=>p.id===curId); if(e){e.name=doc.meta.project||"Untitled";e.updated=Date.now();} saveIndex(); store.set("bpm-current",curId);
}
function addProject(d,name){ normalize(d); d.meta.project=name; const id=newPid(); index.unshift({id,name,updated:Date.now()}); store.set("bpm-doc-"+id,JSON.stringify(d)); saveIndex(); return id; }
function createProject(name,tpl){
  const d=tpl==="sample"?sample():{unit:"imp",cur:0,meta:{project:name,address:"",author:""},floors:[blankFloor("Main floor")]};
  return addProject(d,name);
}
function importFile(text,fname){
  let d=JSON.parse(text);
  if(d.walls&&!d.floors) d={unit:"imp",cur:0,floors:[Object.assign(blankFloor("Floor 1"),{walls:d.walls,openings:d.openings||[],labels:d.labels||[]})]};
  if(!d.floors||!d.floors.length) throw 0;
  d.meta=d.meta||{}; const name=d.meta.project&&d.meta.project!=="My House"?d.meta.project:(fname||"Imported").replace(/\.json$/i,"");
  return addProject(d,name);
}
function openProject(id){
  saveCurrent(); const d=loadDoc(id); if(!d)return;
  curId=id; doc=d; undoS=[];redoS=[];sel=null;polyPts=[];drag=null;hideText();
  if(mode==="3d")setMode("2d");
  syncUnits();floorsBar();renderProps();buttons();$("projname").value=doc.meta.project; autoFit=true; fit(); store.set("bpm-current",id); hideHome(); setTool("select");
}
function cardData(d){
  const prev=doc; doc=d; let img="",area="",rooms=0;
  try{
    const cn=document.createElement("canvas"); cn.width=360; cn.height=240; const g=cn.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,360,240);
    const f=d.floors[Math.min(d.cur,d.floors.length-1)], cb=contentBounds(f);
    if(cb){ const bw=cb.x2-cb.x1+4,bh=cb.y2-cb.y1+4,s=Math.min(330/bw,210/bh); const save=doc.cur; doc.cur=Math.min(d.cur,d.floors.length-1);
      render(g,360,240,{s,ox:(360-(cb.x2-cb.x1)*s)/2-cb.x1*s,oy:(240-(cb.y2-cb.y1)*s)/2-cb.y1*s},LIGHT,false,{noBg:true,noTitle:true,nameFont:7}); doc.cur=save; }
    img=cn.toDataURL("image/png"); area=fmtArea(d.floors.reduce((a,f)=>a+totalArea(f),0)); rooms=d.floors.reduce((a,f)=>a+f.rooms.length,0);
  } finally { doc=prev; }
  return {img,area,rooms};
}
function renderHome(){
  const list=index.slice().sort((a,b)=>b.updated-a.updated); $("hback").style.display=curId&&index.some(p=>p.id===curId)?"":"none";
  if(!list.length){ $("hgrid").innerHTML=`<p class="note">${t("pj_empty")}</p>`; return; }
  $("hgrid").innerHTML=list.map(p=>{
    const d=(p.id===curId)?doc:loadDoc(p.id); if(!d) return "";
    const c=cardData(d), when=new Date(p.updated).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
    const nameHtml=renaming===p.id?`<input data-name="${p.id}" value="${esc(p.name)}" type="text" aria-label="Project name">`:`<div class="pn">${esc(p.name)}</div>`;
    const btns=renaming===p.id?`<button data-act="saveren" data-id="${p.id}" class="on">${t("pj_save")}</button>`:
      `<button data-act="open" data-id="${p.id}" class="on">${t("pj_open")}</button><button data-act="ren" data-id="${p.id}">${t("pj_ren")}</button><button data-act="dup" data-id="${p.id}">${t("pj_dup")}</button><button data-act="export" data-id="${p.id}">${t("pj_exp")}</button><button data-act="del" data-id="${p.id}">${t("pj_del")}</button>`;
    return `<article class="pcard${p.id===curId?" cur":""}"><img data-act="open" data-id="${p.id}" src="${c.img}" alt="${esc(p.name)}">
      <div class="pb">${nameHtml}<div class="pm">${d.floors.length} ${t("pj_floors")} · ${c.rooms} ${t("pj_rooms")} · ${c.area}</div><div class="pm">${t("pj_edited")} ${when}</div><div class="btns">${btns}</div></div></article>`;
  }).join("");
}
function showHome(){ saveCurrent(); renaming=null; renderHome(); $("home").style.display="flex"; }
function hideHome(){ $("home").style.display="none"; }
$("homebtn").onclick=showHome; $("hback").onclick=hideHome;
function createFromForm(){
  const name=$("hname").value.trim()||(t("pj_def")+" "+(index.length+1)); const id=createProject(name,$("htpl").value); $("hname").value=""; openProject(id);
}
$("hcreate").onclick=createFromForm; $("hname").addEventListener("keydown",e=>{ if(e.key==="Enter")createFromForm(); });
$("himport").onclick=()=>$("hfile").click();
$("hfile").onchange=async e=>{ const fl=e.target.files[0]; if(!fl)return; try{ openProject(importFile(await fl.text(),fl.name)); }catch{ $("hgrid").insertAdjacentHTML("beforebegin",`<p class="note">Could not read that file.</p>`); } e.target.value=""; };
$("hgrid").addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b)return; const id=b.dataset.id, act=b.dataset.act, p=index.find(x=>x.id===id); if(!p)return;
  if(act==="open") openProject(id);
  else if(act==="ren"){ renaming=id; renderHome(); const inp=document.querySelector(`[data-name="${id}"]`); if(inp){inp.focus();inp.select();} }
  else if(act==="saveren"){ commitRename(id); }
  else if(act==="dup"){ const d=loadDoc(id)||doc; const c=clone(d); const nid_=addProject(c,(p.name||"Project")+" copy"); renderHome(); }
  else if(act==="export"){ const d=(id===curId)?doc:loadDoc(id); if(d) download(new Blob([JSON.stringify(d,null,2)],{type:"application/json"}),(p.name||"project").replace(/[\\/:*?"<>|]/g,"_")+".json"); }
  else if(act==="del"){
    if(!b.dataset.armed){ b.dataset.armed="1"; b.textContent=t("pj_delc"); b.classList.add("on"); return; }
    index=index.filter(x=>x.id!==id); store.del("bpm-doc-"+id); saveIndex(); if(id===curId){curId=null;} renderHome();
  }
});
$("hgrid").addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.dataset.name) commitRename(e.target.dataset.name); });
function commitRename(id){
  const inp=document.querySelector(`[data-name="${id}"]`), v=inp?inp.value.trim():""; const p=index.find(x=>x.id===id);
  if(p&&v){ p.name=v; if(id===curId){doc.meta.project=v;$("projname").value=v;saveCurrent();} else { const d=loadDoc(id); if(d){d.meta.project=v;store.set("bpm-doc-"+id,JSON.stringify(d));} } saveIndex(); }
  renaming=null; renderHome();
}
$("projname").addEventListener("change",e=>{ const v=e.target.value.trim(); if(v){ doc.meta.project=v; saveCurrent(); renderProps(); } else e.target.value=doc.meta.project; });
$("projname").addEventListener("keydown",e=>{ e.stopPropagation(); if(e.key==="Enter") e.target.blur(); });

/* ================= start ================= */
loadIndex();
try{ const old=localStorage.getItem("blueprint-maker-2"); if(old&&!index.length){ const d=JSON.parse(old); if(d.floors&&d.floors.length){ const id=addProject(d,(d.meta&&d.meta.project)||"My House"); store.set("bpm-current",id); } localStorage.removeItem("blueprint-maker-2"); } }catch{}
if(!index.length){ const id=createProject("My House","sample"); store.set("bpm-current",id); }
{ const last=store.get("bpm-current"); let id=index.some(p=>p.id===last)?last:index[0].id; doc=loadDoc(id); if(!doc){ id=createProject("My House","sample"); doc=loadDoc(id); } curId=id; }
syncUnits(); buildTools(); floorsBar(); buttons(); $("projname").value=doc.meta.project; { const sb=$("stylebtn"), k=planStyle==="print"?"st_print":"st_color"; sb.dataset.i=k; sb.textContent=t(k); }
new ResizeObserver(resize).observe(cv);
resize(); fit(); setTool("select");
showHome();
</script>
